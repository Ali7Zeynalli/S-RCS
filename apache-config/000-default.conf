# ServerName direktiv — AH00558 warning-i aradan qaldırır
ServerName localhost

# SSL Stapling söndürülüb — self-signed sertifikat olduğu üçün
# (issuer certificate tapa bilmir, stapling mənasızdır)
# SSLStaplingCache "shmcb:logs/stapling-cache(150000)"
# SSLUseStapling on
# SSLStaplingResponseMaxAge 900

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # HTTP → HTTPS redirect
    # SRCS_HTTPS_PORT env var-ı docker-compose-dən gəlir (default: 443)
    # Məs: HTTPS_PORT=8043 təyin olunubsa, redirect https://host:8043/...
    PassEnv SRCS_HTTPS_PORT
    RewriteEngine On

    # Host header-dən yalnız host adını çıxart (port olmadan)
    # Sonra düzgün HTTPS port ilə redirect et
    RewriteCond %{HTTPS} off
    RewriteCond %{HTTP_HOST} ^([^:]+)(?::\d+)?$
    RewriteRule ^(.*)$ https://%1:%{ENV:SRCS_HTTPS_PORT}$1 [L,R=301,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    # Modern compatibility
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    # HSTS
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
</VirtualHost>
